version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - npm i -g pnpm
      - pnpm --filter app-frontend install
  pre_build:
    commands:
      - echo "Starting pre_build phase, get all env variables"
      # export the env variables
      - echo VITE_API_BASE_URL=${VITE_API_BASE_URL} >> .env
      # install dependencies
  build:
    commands:
      - pnpm --filter app-frontend build

artifacts:
  files:
    - "**/*"
  base-directory: "apps/frontend"

cache:
  paths:
    - 'node_modules/**/*'  # Cache des dépendances