version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: latest  # Adaptez selon votre langage
  pre_build:
    commands:
      - echo "Starting build phase install all dependencies"
  post_build:
    commands:
      - echo "Build completed on `date`"

artifacts:
  files:
    - '**/*'
  name: mlmBack-$(date +%Y-%m-%d).zip 

cache:
  paths:
    - 'node_modules/**/*'  # Cache des dépendances