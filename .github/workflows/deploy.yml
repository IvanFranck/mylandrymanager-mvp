name: Deploy to AWS
on: 
    push:
        branches:
            - develop
jobs:
  Build-Backend:
    runs-on:
      - codebuild-MLM-Build-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
        run:
            shell: bash
            working-directory: ./apps/app-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up nodeJS
        uses: actions/setup-node@v2

        with:
          node-version: 20.12.2

      - name: Install dependencies
        run: npm install