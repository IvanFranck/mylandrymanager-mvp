version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - npm i -g pnpm
      - pnpm --filter app-frontend install
  pre_build:
    commands:
      - echo "Starting build phase install all dependencies"
  build:
    commands:
      - pnpm --filter app-frontend build

  post_build:
    commands:
      - echo "Build completed on `date`"

artifacts:
  files:
    - '**/*'
  name: mlmFrontApp.zip 

cache:
  paths:
    - 'node_modules/**/*'  # Cache des dépendances