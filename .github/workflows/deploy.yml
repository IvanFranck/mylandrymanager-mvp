name: Deploy to VPS
on: 
  push:
    branches:
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and push all images in parallel
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_ENVIRONMENT: ${{ secrets.VITE_APP_ENVIRONMENT }}
          PUBLIC_JWT_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          PRIVATE_JWT_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
        run: |
          echo "$PUBLIC_JWT_KEY" | sed 's/\r$//' > ./apps/backend/public-key.pem
          echo "$PRIVATE_JWT_KEY" | sed 's/\r$//' > ./apps/backend/private-key.pem

          # Lancer les builds et pushs en parallèle
          docker build --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL --build-arg VITE_APP_ENVIRONMENT=$VITE_APP_ENVIRONMENT -t $DOCKER_USERNAME/mlm-frontend:latest -f ./apps/frontend/Dockerfile ./apps/frontend &
          docker build --target development -t $DOCKER_USERNAME/mlm-main-service:latest -f ./apps/backend/apps/app-backend/Dockerfile ./apps/backend &
          docker build --target development -t $DOCKER_USERNAME/mlm-invoices-service:latest -f ./apps/backend/apps/invoices/Dockerfile ./apps/backend &
          docker build --target development -t $DOCKER_USERNAME/mlm-stats-service:latest -f ./apps/backend/apps/incomes-stats/Dockerfile ./apps/backend &

          wait  # Attendre que tous les builds soient terminés

          # Lancer les pushs en parallèle
          docker push $DOCKER_USERNAME/mlm-frontend:latest &
          docker push $DOCKER_USERNAME/mlm-main-service:latest &
          docker push $DOCKER_USERNAME/mlm-invoices-service:latest &
          docker push $DOCKER_USERNAME/mlm-stats-service:latest &

          wait  # Attendre que tous les pushs soient terminés

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v0.1.7
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEYS }}
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
        with: 
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEYS }}
          script: |
            docker pull $DOCKER_USERNAME/mlm-frontend:latest &
            docker pull $DOCKER_USERNAME/mlm-main-service:latest &
            docker pull $DOCKER_USERNAME/mlm-invoices-service:latest &
            docker pull $DOCKER_USERNAME/mlm-stats-service:latest &

            wait  # Attendre que tous les pull soient terminés

            # Démarrer les nouveaux conteneurs avec les nouvelles images
            docker compose -f ./mlm-project/docker/docker-compose.yml up -d --pull always --no-deps

            # Nettoyer les anciens conteneurs qui ne sont plus utilisés
            docker image prune -f